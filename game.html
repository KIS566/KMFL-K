<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixel Runner Mobile - By CodeshalaByKMFL</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }

    :root {
        --bg-dark: #1a1a2e;
        --bg-light: #16213e;
        --accent: #e94560;
        --accent-2: #0f3460;
        --green: #4ade80;
        --yellow: #fde047;
        --blue: #38bdf8;
        --white: #f1f5f9;
        --shadow: rgba(0,0,0,0.4);
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        touch-action: manipulation;
    }

    #gameContainer {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 900px;
        max-height: 600px;
        box-shadow: 0 20px 60px var(--shadow);
        border-radius: 12px;
        overflow: hidden;
        border: 4px solid var(--accent-2);
        background: #0a0a1a;
    }

    @media (max-width: 768px) {
        #gameContainer {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: auto;
        background: linear-gradient(to bottom, #5de0e6 0%, #87ceeb 60%, #a0d995 100%);
    }

    .ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
    }

    .score-board {
        position: absolute;
        top: 15px;
        right: 15px;
        font-size: clamp(12px, 3vw, 18px);
        text-shadow: 3px 3px 0 var(--shadow);
        background: rgba(15, 52, 96, 0.85);
        padding: 8px 15px;
        border-radius: 8px;
        border: 2px solid var(--white);
    }

    .high-score {
        position: absolute;
        top: 15px;
        left: 15px;
        font-size: clamp(10px, 2.5vw, 14px);
        text-shadow: 3px 3px 0 var(--shadow);
        background: rgba(233, 69, 96, 0.85);
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid var(--white);
    }

    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(26, 26, 46, 0.95);
        z-index: 20;
        pointer-events: all;
        text-align: center;
        padding: 20px;
        transition: opacity 0.3s, transform 0.3s;
    }

    .screen.hidden {
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
    }

    .title {
        font-size: clamp(22px, 7vw, 44px);
        color: var(--yellow);
        text-shadow: 4px 4px 0 var(--accent), 8px 8px 0 var(--accent-2);
        margin-bottom: 20px;
        animation: bounce 1s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .subtitle {
        font-size: clamp(10px, 2.5vw, 15px);
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .btn {
        font-family: 'Press Start 2P', cursive;
        font-size: clamp(12px, 3vw, 18px);
        padding: 14px 28px;
        background: var(--green);
        color: var(--bg-dark);
        border: 4px solid var(--white);
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 6px 0 #22c55e, 0 8px 20px var(--shadow);
        transition: all 0.1s;
        margin: 8px;
        -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
        transform: translateY(6px);
        box-shadow: 0 0 0 #22c55e, 0 2px 10px var(--shadow);
    }

    .controls {
        font-size: clamp(8px, 2vw, 12px);
        color: var(--blue);
        margin-top: 25px;
        line-height: 1.8;
    }

    .game-over-stats {
        background: var(--accent-2);
        border: 3px solid var(--white);
        border-radius: 12px;
        padding: 18px 28px;
        margin: 18px 0;
    }

    .stat-line {
        font-size: clamp(11px, 2.8vw, 17px);
        margin: 10px 0;
    }

    .new-record {
        color: var(--yellow);
        animation: flash 0.5s infinite;
    }

    @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    .touch-hint {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(10px, 2.5vw, 14px);
        color: var(--white);
        opacity: 0.7;
        animation: fadeInOut 2s infinite;
        pointer-events: none;
    }

    @keyframes fadeInOut {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
    }
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-overlay">
        <div class="score-board" id="scoreBoard">Score: 0</div>
        <div class="high-score" id="highScore">Best: 0</div>
        <div class="touch-hint" id="touchHint">TAP TO JUMP</div>
    </div>

    <div class="screen" id="startScreen">
        <div class="title">PIXEL RUNNER</div>
        <div class="subtitle">Run and jump to survive!<br>Avoid obstacles!</div>
        <button class="btn" id="startBtn">START GAME</button>
        <div class="controls">SPACEBAR / CLICK / TAP to jump</div>
    </div>

    <div class="screen hidden" id="gameOverScreen">
        <div class="title">GAME OVER</div>
        <div class="game-over-stats">
            <div class="stat-line" id="finalScore">Score: 0</div>
            <div class="stat-line" id="bestScore">Best: 0</div>
        </div>
        <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: false });

        // DOM Elements
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreBoard = document.getElementById('scoreBoard');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const touchHint = document.getElementById('touchHint');

        // ----- Game Constants (optimized values) -----
        const GRAVITY = 0.55;
        const JUMP_FORCE = -12;
        const GROUND_HEIGHT = 70;
        const PLAYER_SIZE = 36;
        const INITIAL_SPEED = 4.5;
        const SPEED_INC = 0.0007;
        const OBSTACLE_GAP_MIN = 280;
        const OBSTACLE_GAP_MAX = 550;

        // ----- Responsive Canvas -----
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 100);
        });

        // ----- Game State -----
        let gameState = 'start';
        let score = 0;
        let highScore = 0;
        try {
            highScore = parseInt(localStorage.getItem('pixelRunnerHighScoreV2') || '0');
        } catch (e) { highScore = 0; }
        let gameSpeed = INITIAL_SPEED;
        let frameCount = 0;
        let lastObstacleX = 0;

        highScoreEl.textContent = `Best: ${highScore}`;

        // ----- Player Object -----
        const player = {
            x: 80,
            y: 0,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            vy: 0,
            jumping: false,
            rotation: 0,
            reset() {
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.vy = 0;
                this.jumping = false;
                this.rotation = 0;
            },
            jump() {
                if (!this.jumping && gameState === 'playing') {
                    this.vy = JUMP_FORCE;
                    this.jumping = true;
                }
            },
            update() {
                this.vy += GRAVITY;
                this.y += this.vy;
                const groundY = canvas.height - GROUND_HEIGHT - this.height;
                if (this.y >= groundY) {
                    this.y = groundY;
                    this.vy = 0;
                    this.jumping = false;
                    this.rotation = 0;
                } else {
                    this.rotation += 0.12;
                }
            },
            draw() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                ctx.fillStyle = '#e94560';
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(-10, -7, 7, 7);
                ctx.fillRect(4, -7, 7, 7);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(-7, -4, 3, 3);
                ctx.fillRect(7, -4, 3, 3);
                ctx.fillRect(this.jumping ? -5 : -7, 5, this.jumping ? 10 : 14, 4);
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            }
        };

        // ----- Obstacles -----
        let obstacles = [];
        class Obstacle {
            constructor(x) {
                this.x = x;
                this.width = 28 + Math.random() * 18;
                this.height = 35 + Math.random() * 55;
                this.y = canvas.height - GROUND_HEIGHT - this.height;
                this.color = Math.random() > 0.5 ? '#f59e0b' : '#38bdf8';
            }
            update() { this.x -= gameSpeed; }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(this.x + 3, this.y + 5, this.width - 6, 7);
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
            offScreen() { return this.x + this.width < 0; }
            hits(obj) {
                return obj.x < this.x + this.width &&
                    obj.x + obj.width > this.x &&
                    obj.y < this.y + this.height &&
                    obj.y + obj.height > this.y;
            }
        }

        // ----- Background Clouds (reduced) -----
        const clouds = [];
        for (let i = 0; i < 4; i++) {
            clouds.push({
                x: Math.random() * 900,
                y: 30 + Math.random() * 90,
                w: 50 + Math.random() * 35,
                speed: 0.4 + Math.random() * 0.4
            });
        }

        // ----- Drawing Functions (optimized) -----
        function drawGround() {
            const gy = canvas.height - GROUND_HEIGHT;
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(0, gy, canvas.width, GROUND_HEIGHT);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, gy, canvas.width, 10);
            ctx.fillStyle = '#22c55e';
            for (let x = 0; x < canvas.width; x += 14) {
                ctx.fillRect(x - (frameCount * gameSpeed * 0.5) % 14, gy + 2, 7, 3);
            }
        }

        function drawClouds() {
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            for (let c of clouds) {
                ctx.fillRect(c.x, c.y, c.w, 16);
                ctx.fillRect(c.x + 8, c.y - 8, c.w - 16, 16);
                c.x -= c.speed;
                if (c.x + c.w < 0) {
                    c.x = canvas.width;
                    c.y = 25 + Math.random() * 90;
                }
            }
        }

        function spawnObstacle() {
            const gap = OBSTACLE_GAP_MIN + Math.random() * (OBSTACLE_GAP_MAX - OBSTACLE_GAP_MIN);
            const x = lastObstacleX + gap;
            if (x > canvas.width) {
                obstacles.push(new Obstacle(canvas.width));
                lastObstacleX = canvas.width;
            }
        }

        function checkCollision() {
            for (let ob of obstacles) {
                if (ob.hits(player)) return true;
            }
            return false;
        }

        // ----- Game Flow -----
        function startGame() {
            gameState = 'playing';
            score = 0;
            frameCount = 0;
            gameSpeed = INITIAL_SPEED;
            obstacles = [];
            lastObstacleX = canvas.width;
            player.reset();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            touchHint.style.display = 'block';
            if (window.AudioContext || window.webkitAudioContext) {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                if (ac.state === 'suspended') ac.resume();
            }
        }

        function endGame() {
            gameState = 'gameover';
            let newBest = false;
            if (score > highScore) {
                highScore = score;
                try { localStorage.setItem('pixelRunnerHighScoreV2', highScore); } catch(e) {}
                highScoreEl.textContent = `Best: ${highScore}`;
                newBest = true;
            }
            finalScoreEl.textContent = `Score: ${score}`;
            bestScoreEl.textContent = newBest ? `NEW BEST: ${highScore}!` : `Best: ${highScore}`;
            if (newBest) bestScoreEl.classList.add('new-record');
            else bestScoreEl.classList.remove('new-record');
            gameOverScreen.classList.remove('hidden');
            touchHint.style.display = 'none';
        }

        // ----- Main Loop (with performance timing) -----
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height - GROUND_HEIGHT);
            grad.addColorStop(0, '#5de0e6');
            grad.addColorStop(0.6, '#87ceeb');
            grad.addColorStop(1, '#a0d995');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height - GROUND_HEIGHT);

            drawClouds();
            drawGround();

            if (gameState === 'playing') {
                player.update();
                player.draw();

                if (frameCount % 55 === 0) spawnObstacle();

                obstacles = obstacles.filter(ob => {
                    ob.update();
                    ob.draw();
                    return !ob.offScreen();
                });

                if (checkCollision()) endGame();

                frameCount++;
                score = Math.floor(frameCount / 10);
                scoreBoard.textContent = `Score: ${score}`;
                gameSpeed += SPEED_INC;

                if (frameCount > 90) {
                    touchHint.style.opacity = Math.max(0, 1 - (frameCount - 90) / 50);
                }
            } else {
                player.draw();
            }

            requestAnimationFrame(gameLoop);
        }

        // ----- Input Handling (mobile-optimized) -----
        function handleJump(e) {
            if (e) e.preventDefault();
            if (gameState === 'start') startGame();
            else if (gameState === 'playing') player.jump();
            else if (gameState === 'gameover') startGame();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
                e.preventDefault();
                handleJump();
            }
        });

        canvas.addEventListener('pointerdown', handleJump);
        canvas.addEventListener('click', handleJump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleJump(e);
        }, { passive: false });

        startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
        restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Start
        player.reset();
        gameLoop();
    })();
</script>
</body>
</html>
